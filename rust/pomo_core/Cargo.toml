[package]
name = "pomo_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
flate2 = "1.0"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
sha2 = "0.10"
